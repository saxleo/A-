<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板块主力资金排行</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
body { background: #0f172a; color: #e2e8f0; }
.card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
.positive { color: #f87171; }
.negative { color: #4ade80; }
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-6xl mx-auto">
  <header class="mb-6">
    <h1 class="text-2xl font-bold text-white">📊 板块主力资金净流入排行</h1>
    <p class="text-slate-400 text-sm mt-1">数据时间: <span id="data-time">加载中...</span></p>
  </header>

  <!-- 图表区域 -->
  <div class="card p-4 mb-6">
    <div id="chart" style="width:100%;height:400px;"></div>
  </div>

  <!-- 排行表格 -->
  <div class="card p-4">
    <h2 class="text-lg font-semibold mb-4">🏆 板块排行 TOP 20</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-slate-400 border-b border-slate-700">
            <th class="text-left py-2 px-3">排名</th>
            <th class="text-left py-2 px-3">行业板块</th>
            <th class="text-right py-2 px-3">主力净流入</th>
            <th class="text-right py-2 px-3">平均涨跌</th>
            <th class="text-right py-2 px-3">个股数</th>
            <th class="text-left py-2 px-3">领涨股</th>
            <th class="text-right py-2 px-3">领涨涨幅</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          <tr><td colspan="7" class="py-8 text-center text-slate-500">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="mt-6 text-center text-xs text-slate-600">
    数据来源: 东方财富妙想智能选股 | 自动更新 | 
    <a href="https://github.com/saxleo/A-" class="text-slate-400 hover:text-white">GitHub</a>
  </footer>
</div>

<script>
// 加载数据
async function loadData() {
  try {
    const resp = await fetch('data/sector_ranking.json?t=' + Date.now());
    const data = await resp.json();
    
    document.getElementById('data-time').textContent = 
      new Date(data.timestamp).toLocaleString('zh-CN');
    
    renderTable(data.sectors);
    renderChart(data.sectors);
  } catch (e) {
    document.getElementById('ranking-body').innerHTML = 
      `<tr><td colspan="7" class="py-8 text-center text-red-400">加载失败: ${e.message}</td></tr>`;
  }
}

function renderTable(sectors) {
  const tbody = document.getElementById('ranking-body');
  tbody.innerHTML = sectors.map((s, i) => `
    <tr class="border-b border-slate-800 hover:bg-slate-800/50 transition">
      <td class="py-3 px-3 font-mono ${i < 3 ? 'text-yellow-400 font-bold' : 'text-slate-400'}">${i + 1}</td>
      <td class="py-3 px-3 font-medium text-white">${s.name}</td>
      <td class="py-3 px-3 text-right ${s.total_main_force_raw > 0 ? 'positive' : 'negative'}">${s.total_main_force}</td>
      <td class="py-3 px-3 text-right ${s.avg_change_pct > 0 ? 'positive' : 'negative'}">${s.avg_change_pct > 0 ? '+' : ''}${s.avg_change_pct}%</td>
      <td class="py-3 px-3 text-right text-slate-400">${s.stock_count}</td>
      <td class="py-3 px-3 text-slate-300">${s.top_stock.name} <span class="text-xs text-slate-500">${s.top_stock.code}</span></td>
      <td class="py-3 px-3 text-right ${s.top_stock.change_pct > 0 ? 'positive' : 'negative'}">${s.top_stock.change_pct > 0 ? '+' : ''}${s.top_stock.change_pct}%</td>
    </tr>
  `).join('');
}

function renderChart(sectors) {
  const chart = echarts.init(document.getElementById('chart'));
  const top10 = sectors.slice(0, 15);
  
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      formatter: function(params) {
        const p = params[0];
        const s = top10[p.dataIndex];
        return `<b>${s.name}</b><br/>
                主力净流入: ${s.total_main_force}<br/>
                平均涨跌: ${s.avg_change_pct > 0 ? '+' : ''}${s.avg_change_pct}%<br/>
                个股数: ${s.stock_count}<br/>
                领涨: ${s.top_stock.name} ${s.top_stock.change_pct > 0 ? '+' : ''}${s.top_stock.change_pct}%`;
      }
    },
    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
    xAxis: {
      type: 'category',
      data: top10.map(s => s.name),
      axisLabel: { color: '#94a3b8', rotate: 30, fontSize: 11 },
      axisLine: { lineStyle: { color: '#334155' } }
    },
    yAxis: {
      type: 'value',
      name: '主力净流入(亿元)',
      nameTextStyle: { color: '#64748b', fontSize: 10 },
      axisLabel: { color: '#64748b', formatter: v => (v/1e8).toFixed(0) + '亿' },
      splitLine: { lineStyle: { color: '#1e293b' } }
    },
    series: [{
      name: '主力净流入',
      type: 'bar',
      data: top10.map(s => s.total_main_force_raw),
      itemStyle: {
        color: p => {
          const val = top10[p.dataIndex].total_main_force_raw;
          return val > 0 ? '#f87171' : '#4ade80';
        },
        borderRadius: [4, 4, 0, 0]
      },
      barWidth: '60%'
    }]
  });
}

loadData();
</script>
</body>
</html>
