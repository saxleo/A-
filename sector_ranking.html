<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超黄板块资金看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #0a0e1a; 
    color: #e2e8f0; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 16px;
}
.container { max-width: 800px; margin: 0 auto; }

.header { margin-bottom: 16px; }
.header h1 { 
    font-size: 26px; 
    font-weight: 800; 
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.header .meta { 
    color: #64748b; 
    font-size: 12px; 
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.date-selector {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 12px;
    color: #e2e8f0;
    font-size: 14px;
    cursor: pointer;
}
.date-selector option {
    background: #1a1f2e;
    color: #e2e8f0;
}

.card { 
    background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
    border-radius: 14px; 
    border: 1px solid rgba(255,255,255,0.06);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.card-title { 
    font-size: 16px; 
    font-weight: 700; 
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.fund-grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 10px; 
}
.fund-item { 
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.05);
}
.fund-item .label { 
    font-size: 12px; 
    color: #64748b; 
    margin-bottom: 4px;
}
.fund-item .amount { 
    font-size: 24px; 
    font-weight: 800;
    margin-bottom: 6px;
}
.fund-item .amount.in { color: #ff4757; }
.fund-item .amount.out { color: #2ed573; }
.fund-bar { 
    height: 3px; 
    border-radius: 2px; 
    background: rgba(255,255,255,0.06);
    overflow: hidden;
}
.fund-bar-inner { 
    height: 100%; 
    border-radius: 2px;
}

.ranking-list { list-style: none; }
.ranking-item { 
    display: flex; 
    align-items: center; 
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.ranking-item:last-child { border-bottom: none; }

.rank-num { 
    width: 28px; 
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    margin-right: 10px;
    flex-shrink: 0;
}
.rank-num.top1 { background: linear-gradient(135deg, #ff4757, #ff6348); }
.rank-num.top2 { background: linear-gradient(135deg, #ff6348, #feca57); }
.rank-num.top3 { background: linear-gradient(135deg, #feca57, #48dbfb); }
.rank-num.normal { background: rgba(255,255,255,0.08); color: #94a3b8; }

.concept-info { flex: 1; min-width: 0; }
.concept-name { 
    font-size: 14px; 
    font-weight: 600;
    margin-bottom: 2px;
}
.concept-change { 
    font-size: 11px; 
    font-weight: 600;
}
.concept-change.up { color: #ff4757; }
.concept-change.down { color: #2ed573; }

.progress-area { 
    flex: 1; 
    margin: 0 10px;
    max-width: 160px;
}
.progress-bar { 
    height: 5px; 
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
}
.progress-bar-inner { 
    height: 100%; 
    border-radius: 3px;
    transition: width 0.5s ease;
}
.progress-bar-inner.in { background: linear-gradient(90deg, #ff4757, #ff6348); }
.progress-bar-inner.out { background: linear-gradient(90deg, #2ed573, #26de81); }

.net-amount { 
    font-size: 14px; 
    font-weight: 700;
    width: 80px;
    text-align: right;
    flex-shrink: 0;
}
.net-amount.in { color: #ff4757; }
.net-amount.out { color: #2ed573; }

.footer { 
    text-align: center; 
    color: #475569; 
    font-size: 10px;
    margin-top: 16px;
    padding: 12px;
}

.history-note {
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    color: #feca57;
    display: none;
}

.status-bar {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #64748b;
}
.status-bar .update-time { color: #94a3b8; }
.status-bar .next-time { color: #475569; }
.status-bar .live-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2ed573;
    margin-right: 6px;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}
</style>
</head>
<body>

  <div class="footer">
    <p>超黄体系 | 数据仅供参考，不构成投资建议</p>

historyData['20260825'] = {"date": "20260825", "time": "1500", "timestamp": "2026-08-25T15:00:04.775050", "wind_fund": {"机构": 403.3925, "大户": 236.4971, "中户": 112.7942, "散户": 60.8723}, "concepts": [{"name": "PCB", "change_pct": 0.51, "main_force": 27.3}, {"name": "创新药", "change_pct": 2.24, "main_force": 26.0}, {"name": "光通信", "change_pct": 0.68, "main_force": 17.7}, {"name": "AI应用", "change_pct": 1.89, "main_force": 17.0}, {"name": "机器人概念", "change_pct": 2.23, "main_force": 1.1}, {"name": "电网设备", "change_pct": 1.12, "main_force": -1.5}, {"name": "算力概念", "change_pct": 1.18, "main_force": -5.7}, {"name": "存储芯片", "change_pct": -0.4, "main_force": -5.8}, {"name": "半导体材料", "change_pct": -2.28, "main_force": -5.8}, {"name": "MLCC", "change_pct": 0.15, "main_force": -5.9}, {"name": "银行", "change_pct": -0.75, "main_force": -12.0}, {"name": "先进封装", "change_pct": -0.28, "main_force": -12.5}, {"name": "半导体概念", "change_pct": -0.4, "main_force": -19.5}, {"name": "有色金属", "change_pct": -1.12, "main_force": -57.3}]};
historyData['20260831'] = {"date": "20260831", "time": "0926", "timestamp": "2026-08-31T09:26:05.094140", "wind_fund": {"机构": 0, "大户": 0, "中户": 0, "散户": 0}, "concepts": []};

let currentViewDate = '20260831';
let isHistoryView = false;

// 每30秒自动刷新（仅当天数据）
setInterval(() => {
    if (isHistoryView) return;
    
    fetch('data/' + currentViewDate + '.json?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
            if (data && data.length > 0) {
                const latest = data[data.length - 1];
                renderData(latest);
                // 更新时间显示
                const t = latest.time;
                const timeStr = t.slice(0,2) + ':' + t.slice(2,4) + ':00';
                document.querySelector('.status-bar span').innerHTML = 
                    '<span class="live-dot"></span>数据更新: ' + timeStr;
            }
        })
        .catch(e => console.error('轮询失败:', e));
}, 30000);

function changeDate(dateStr) {
    if (!dateStr) {
        isHistoryView = false;
        currentViewDate = '20260831';
        location.reload();
        return;
    }
    
    isHistoryView = true;
    currentViewDate = dateStr;
    
    // 显示历史提示
    document.getElementById('historyNote').style.display = 'block';
    document.getElementById('current-date').textContent = 
        dateStr.slice(0,4) + '-' + dateStr.slice(4,6) + '-' + dateStr.slice(6);
    
    // 加载历史数据
    fetch('data/' + dateStr + '.json?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
            if (data && data.length > 0) {
                const latest = data[data.length - 1];
                renderData(latest);
            }
        })
        .catch(e => {
            console.error('加载历史数据失败:', e);
            alert('加载历史数据失败，请稍后重试');
        });
}

function renderData(data) {
    // 更新资金数据
    const fundMap = {
        '机构': {label: '机构', color: '#ff4757'},
        '大户': {label: '大户', color: '#ff6348'},
        '中户': {label: '中户', color: '#feca57'},
        '散户': {label: '散户', color: '#48dbfb'}
    };
    
    const windFund = data.wind_fund || {};
    const fundGrid = document.getElementById('fundGrid');
    const maxFund = Math.max(...Object.values(windFund).map(Math.abs), 1);
    
    let fundHtml = '';
    for (const [type, config] of Object.entries(fundMap)) {
        const value = windFund[type] || 0;
        const isIn = value > 0;
        const barColor = isIn ? config.color : '#2ed573';
        const barWidth = Math.min(Math.abs(value) / maxFund * 100, 100);
        
        fundHtml += `
        <div class="fund-item">
            <div class="label">${config.label}资金</div>
            <div class="amount ${isIn ? 'in' : 'out'}">${value > 0 ? '+' : ''}${value.toFixed(1)}亿</div>
            <div class="fund-bar">
                <div class="fund-bar-inner" style="width: ${barWidth}%; background: ${barColor};"></div>
            </div>
        </div>`;
    }
    fundGrid.innerHTML = fundHtml;
    
    // 更新板块排行
    const concepts = data.concepts || [];
    const maxNet = Math.max(...concepts.map(c => Math.abs(c.main_force)), 1);
    const listEl = document.getElementById('rankingList');
    
    let listHtml = '';
    concepts.forEach((c, i) => {
        const rank = i + 1;
        const isIn = c.main_force > 0;
        let rankClass = 'normal';
        if (rank === 1) rankClass = 'top1';
        else if (rank === 2) rankClass = 'top2';
        else if (rank === 3) rankClass = 'top3';
        
        const changeClass = c.change_pct > 0 ? 'up' : 'down';
        const changeSign = c.change_pct > 0 ? '+' : '';
        const netClass = isIn ? 'in' : 'out';
        const barWidth = Math.min(Math.abs(c.main_force) / maxNet * 100, 100);
        const barColorClass = isIn ? 'in' : 'out';
        
        listHtml += `
        <li class="ranking-item">
            <div class="rank-num ${rankClass}">${rank.toString().padStart(2, '0')}</div>
            <div class="concept-info">
                <div class="concept-name">${c.name}</div>
                <div class="concept-change ${changeClass}">${changeSign}${c.change_pct.toFixed(2)}%</div>
            </div>
            <div class="progress-area">
                <div class="progress-bar">
                    <div class="progress-bar-inner ${barColorClass}" style="width: ${barWidth}%"></div>
                </div>
            </div>
            <div class="net-amount ${netClass}">${c.main_force > 0 ? '+' : ''}${c.main_force.toFixed(1)}亿</div>
        </li>`;
    });
    listEl.innerHTML = listHtml;
}
</script>

</body>
</html>
