<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 14板块监控看板</title>
<style>
:root{--bg:#0a0e17;--card-bg:#111827;--elevated:#1f2937;--border:#374151;--text:#f3f4f6;--muted:#9ca3af;--up:#ef4444;--up-bg:rgba(239,68,68,0.1);--down:#22c55e;--down-bg:rgba(34,197,94,0.1);--accent:#3b82f6;--gold:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.header{text-align:center;padding:20px 20px 10px}
.header h1{font-size:24px;font-weight:700;letter-spacing:1px}
.header .meta{color:var(--muted);font-size:12px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1400px;margin:0 auto;padding:0 16px 20px}
@media(min-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px;transition:all .2s}
.card:hover{border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:15px;font-weight:600}
.card-tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.tag-up{background:var(--up-bg);color:var(--up)}
.tag-down{background:var(--down-bg);color:var(--down)}
.card-stats{display:flex;gap:12px;margin-bottom:8px;font-size:13px}
.stat-item{display:flex;flex-direction:column}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.stat-val{font-family:'SF Mono',Monaco,monospace;font-weight:700;font-size:15px}
.fund-bar{height:4px;border-radius:2px;margin-top:6px;overflow:hidden;background:var(--elevated)}
.fund-bar-inner{height:100%;border-radius:2px;transition:width .3s}
.card-footer{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.status-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
#refreshBtn{background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px}
#refreshBtn:hover{opacity:.9}
.loading{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div class="header">
  <h1>🔥 14板块实时监控</h1>
  <div class="meta">
    <span id="updateTime">--</span> · 
    <span id="plateCount">14</span>个板块 · 
    <span id="refreshStatus">自动刷新中(2分钟)</span>
  </div>
</div>
<div class="grid" id="plateGrid"></div>

<div class="status-bar">
  <span id="statusText">初始化...</span>
  <button id="refreshBtn" onclick="manualRefresh()">🔄 立即刷新</button>
</div>

<script>
// ========== 配置 ==========
const REFRESH_INTERVAL = 120000; // 2分钟
let currentData = null;
let refreshTimer = null;

// ========== 获取今天日期 ==========
function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + 
    String(d.getMonth()+1).padStart(2,'0') + 
    String(d.getDate()).padStart(2,'0');
}

// ========== 获取最新时间点数据 ==========
function getLatestData(dayData) {
  if (!dayData) return null;
  const times = Object.keys(dayData).sort();
  if (times.length === 0) return null;
  return dayData[times[times.length - 1]];
}

// ========== 渲染板块卡片 ==========
function renderCards(plates) {
  const grid = document.getElementById('plateGrid');
  if (!plates || plates.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">暂无数据</div>';
    return;
  }
  
  // 按涨幅排序
  const sorted = [...plates].sort((a, b) => b.change - a.change);
  
  grid.innerHTML = sorted.map(p => {
    const isUp = p.change >= 0;
    const color = isUp ? 'var(--up)' : 'var(--down)';
    const tagClass = isUp ? 'tag-up' : 'tag-down';
    const arrow = isUp ? '▲' : '▼';
    const fundColor = p.fund >= 0 ? 'var(--up)' : 'var(--down)';
    
    // 资金流向条宽度 (以300亿为满)
    const maxFund = 300;
    const barWidth = Math.min(Math.abs(p.fund) / maxFund * 100, 100);
    const barColor = p.fund >= 0 ? 'var(--up)' : 'var(--down)';
    
    return `
    <div class="card">
      <div class="card-header">
        <span class="card-title">${p.name}</span>
        <span class="card-tag ${tagClass}">${arrow} ${Math.abs(p.change).toFixed(2)}%</span>
      </div>
      <div class="card-stats">
        <div class="stat-item">
          <span class="stat-label">主力净流入</span>
          <span class="stat-val" style="color:${fundColor}">${p.fund >= 0 ? '+' : ''}${p.fund.toFixed(1)}亿</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">净占比</span>
          <span class="stat-val" style="color:${fundColor}">${p.fund_ratio >= 0 ? '+' : ''}${p.fund_ratio.toFixed(2)}%</span>
        </div>
      </div>
      <div class="fund-bar">
        <div class="fund-bar-inner" style="width:${barWidth}%;background:${barColor}"></div>
      </div>
      <div class="card-footer">
        <span>${p.code}</span>
        <span>东财</span>
      </div>
    </div>
    `;
  }).join('');
}

// ========== 获取数据 ==========
async function fetchData() {
  const statusText = document.getElementById('statusText');
  const grid = document.getElementById('plateGrid');
  
  try {
    statusText.textContent = '获取数据中...';
    grid.classList.add('loading');
    
    const todayStr = getTodayStr();
    const resp = await fetch(`data/${todayStr}.json?t=${Date.now()}`);
    
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    
    const dayData = await resp.json();
    const plates = getLatestData(dayData);
    
    if (!plates) {
      throw new Error('数据为空');
    }
    
    currentData = plates;
    renderCards(plates);
    
    // 更新时间显示
    const times = Object.keys(dayData).sort();
    const latestTime = times[times.length - 1];
    document.getElementById('updateTime').textContent = `${todayStr.slice(0,4)}-${todayStr.slice(4,6)}-${todayStr.slice(6,8)} ${latestTime}`;
    document.getElementById('plateCount').textContent = plates.length;
    statusText.textContent = `✅ 最后更新: ${latestTime} · 共${times.length}个时间点`;
    
  } catch (err) {
    console.error('获取数据失败:', err);
    statusText.textContent = `❌ 获取失败: ${err.message}`;
    // 如果有旧数据，继续显示
    if (currentData) {
      renderCards(currentData);
    }
  } finally {
    grid.classList.remove('loading');
  }
}

// ========== 手动刷新 ==========
function manualRefresh() {
  fetchData();
}

// ========== 自动刷新 ==========
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(fetchData, REFRESH_INTERVAL);
}

// ========== 初始化 ==========
async function init() {
  await fetchData();
  startAutoRefresh();
}

// 启动
init();
</script>
</body>
</html>
